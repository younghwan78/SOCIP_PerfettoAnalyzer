[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-perfetto-analyzer"
version = "0.2.0"
description = "Phase 9 v2 SoC Perfetto analyzer report renderer and quality gate"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "perfetto>=0.16",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
soc-perfetto-analyzer = "soc_perfetto_analyzer.cli:main"

[tool.setuptools]
py-modules = ["charts", "render", "sample_model"]

[tool.setuptools.packages.find]
include = ["soc_perfetto_analyzer*"]
